<!DOCTYPE html>
<!--
  REDIRECT: the music page moved from mymusic.html to music.html (October 2026).

  This tiny page exists only so that old links and bookmarks to
  mymusic.html still work: it forwards the visitor straight to music.html.
  (GitHub Pages can't do "proper" server redirects, so this is the standard
  workaround.)

  Safe to delete in the far future, once nothing links to the old address.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Forward to the new address after 0 seconds, i.e. immediately -->
    <meta http-equiv="refresh" content="0; url=music.html">

    <!-- Tell search engines the real page is music.html, and not to list this one -->
    <link rel="canonical" href="https://dylanmercurycooper.github.io/music.html">
    <meta name="robots" content="noindex">

    <title>Music — Dylan Mercury Cooper</title>
</head>
<body>
    <!-- Only seen if the automatic forward fails: a plain link to click -->
    <p><a href="music.html">music.html</a></p>
</body>
</html>
